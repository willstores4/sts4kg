name: Build PS4 Homebrew Store PKG

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  OO_TOOLCHAIN_VERSION: v0.5.4
  OO_TOOLCHAIN_ASSET: toolchain-llvm-18.tar.gz
  LLVM_VERSION: '18'
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
  NULLSTORE_KEEP_ICONS: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools (clang/lld ${{ env.LLVM_VERSION }}, Python, Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION} make python3 python3-pil fonts-dejavu-core unzip
          echo "LLVM_BIN=/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Install libssl1.1 (required by PkgTool.Core / .NET Core 3.1)
        run: |
          set -euo pipefail
          for BASE in http://archive.ubuntu.com/ubuntu/pool/main/o/openssl http://security.ubuntu.com/ubuntu/pool/main/o/openssl; do
            DEB=$(curl -fsSL "$BASE/" | grep -oE 'libssl1\.1_1\.1\.1f-1ubuntu2\.[0-9]+_amd64\.deb' | sort -uV | tail -1 || true)
            if [ -n "$DEB" ] && curl -fsSL -o /tmp/libssl1.1.deb "$BASE/$DEB"; then
              echo "Installing $BASE/$DEB"; sudo dpkg -i /tmp/libssl1.1.deb; exit 0
            fi
          done
          echo "::error::Não foi possível baixar libssl1.1"; exit 1

      - name: Cache OpenOrbis toolchain
        id: cache-oo
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: openorbis-${{ env.OO_TOOLCHAIN_VERSION }}-${{ env.OO_TOOLCHAIN_ASSET }}

      - name: Download OpenOrbis toolchain
        if: steps.cache-oo.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl -fL --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_TOOLCHAIN_VERSION}/${OO_TOOLCHAIN_ASSET}" \
            | tar -xz -C "$RUNNER_TEMP/toolchain"

      - name: Locate toolchain and copy sce_module
        run: |
          set -euo pipefail
          LINKX=$(find "$RUNNER_TEMP/toolchain" -maxdepth 4 -name link.x -print -quit)
          test -n "$LINKX" || { echo "::error::link.x não encontrado no toolchain"; exit 1; }
          OO="$(dirname "$LINKX")"
          chmod -R +x "$OO/bin/linux"
          echo "OO_PS4_TOOLCHAIN=$OO" >> "$GITHUB_ENV"

          mkdir -p sce_module
          for m in libc.prx libSceFios2.prx; do
            src=$(find "$OO" -name "$m" -path '*sce_module*' -print -quit)
            test -n "$src" || { echo "::error::$m não encontrado no toolchain"; exit 1; }
            cp "$src" sce_module/
          done

      - name: Run host & web panel unit tests
        run: |
          make LLVM="$LLVM_BIN" HOST_CXX="$LLVM_BIN/clang++" HOST_CC="$LLVM_BIN/clang" OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" test

      - name: Build Homebrew Store PKG
        run: |
          make LLVM="$LLVM_BIN" OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Validate PKG
        run: |
          make LLVM="$LLVM_BIN" OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" validate

      - name: Collect artifacts
        id: collect
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          cp build/IV0000-WGST00001_00-WGSTORE000000000.pkg "dist/HomebrewStore-PS4-${VER}.pkg"
          (cd dist && sha256sum *.pkg | tee SHA256SUMS.txt)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomebrewStore-PKG-${{ steps.collect.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
