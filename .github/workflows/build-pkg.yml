name: Build PS4 PKG

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'screenshots/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar Releases em tags v*

env:
  OO_TOOLCHAIN_VERSION: v0.5.4
  OO_TOOLCHAIN_ASSET: toolchain-llvm-18.tar.gz
  LLVM_VERSION: '18'
  # Itemzflow jb.prx (GPL-3.0), revisão citada no README
  ITEMZFLOW_REV: e71c284c61db3fce53936178db30dd38be7ba47b
  ITEMZFLOW_JB_SHA256: a06d09989e0a5df001866a57ada34412287f21e757e5a7c71c05d8a28b930ecb
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
  NULLSTORE_KEEP_ICONS: '1'   # usa os ícones já versionados (não regera com outra fonte)

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools (clang/lld ${{ env.LLVM_VERSION }}, Python, Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION} make python3 python3-pil fonts-dejavu-core unzip
          echo "LLVM_BIN=/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Install libssl1.1 (required by PkgTool.Core / .NET Core 3.1)
        run: |
          set -euo pipefail
          for BASE in http://archive.ubuntu.com/ubuntu/pool/main/o/openssl http://security.ubuntu.com/ubuntu/pool/main/o/openssl; do
            DEB=$(curl -fsSL "$BASE/" | grep -oE 'libssl1\.1_1\.1\.1f-1ubuntu2\.[0-9]+_amd64\.deb' | sort -uV | tail -1 || true)
            if [ -n "$DEB" ] && curl -fsSL -o /tmp/libssl1.1.deb "$BASE/$DEB"; then
              echo "Installing $BASE/$DEB"; sudo dpkg -i /tmp/libssl1.1.deb; exit 0
            fi
          done
          echo "::error::Não foi possível baixar libssl1.1"; exit 1

      - name: Cache OpenOrbis toolchain
        id: cache-oo
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: openorbis-${{ env.OO_TOOLCHAIN_VERSION }}-${{ env.OO_TOOLCHAIN_ASSET }}

      - name: Download OpenOrbis toolchain
        if: steps.cache-oo.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl -fL --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_TOOLCHAIN_VERSION}/${OO_TOOLCHAIN_ASSET}" \
            | tar -xz -C "$RUNNER_TEMP/toolchain"

      - name: Locate toolchain
        run: |
          LINKX=$(find "$RUNNER_TEMP/toolchain" -maxdepth 4 -name link.x -print -quit)
          test -n "$LINKX" || { echo "::error::link.x não encontrado no toolchain"; exit 1; }
          OO="$(dirname "$LINKX")"
          chmod -R +x "$OO/bin/linux"
          echo "OO_PS4_TOOLCHAIN=$OO" >> "$GITHUB_ENV"
          echo "Toolchain: $OO"
          ls -la "$OO/bin/linux"

      - name: Prepare external assets (sce_module, compat-jb.prx, covers)
        run: |
          set -euo pipefail
          # Runtime modules gerados pelo toolchain (copiados para os samples)
          mkdir -p sce_module
          for m in libc.prx libSceFios2.prx; do
            src=$(find "$OO_PS4_TOOLCHAIN" -name "$m" -path '*sce_module*' -print -quit)
            test -n "$src" || { echo "::error::$m não encontrado no toolchain"; exit 1; }
            cp "$src" sce_module/
          done
          ls -la sce_module

          # Módulo de compatibilidade do Itemzflow (sem modificações)
          URL="https://raw.githubusercontent.com/LightningMods/Itemzflow/${ITEMZFLOW_REV}/App-Media-Assets/Media/jb.prx"
          curl -fL --retry 3 -o assets/service/compat-jb.prx "$URL"
          echo "${ITEMZFLOW_JB_SHA256}  assets/service/compat-jb.prx" | sha256sum -c -
          cat > assets/service/COMPAT-PROVENANCE.txt <<EOF
          compat-jb.prx is the unmodified jb.prx from LightningMods/Itemzflow (GPL-3.0).
          Revision: ${ITEMZFLOW_REV}
          Source:   ${URL}
          SHA-256:  ${ITEMZFLOW_JB_SHA256}
          EOF

          # Capas: usa as que estiverem no repositório (assets/covers/*.jpg); pode ficar vazio.
          mkdir -p assets/covers
          echo "Covers: $(ls assets/covers/*.jpg 2>/dev/null | wc -l)"

      - name: Build NULL_store PKG
        run: make LLVM="$LLVM_BIN" OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Build Background Service PKG
        run: make LLVM="$LLVM_BIN" OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" service-package

      - name: Validate packages
        continue-on-error: true
        run: |
          PKGTOOL="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          for p in build/*.pkg; do "$PKGTOOL" pkg_validate "$p" || true; done
          python3 tools/verify_package.py build/IV0000-NULL00001_00-NULLSTOR00000000.pkg --tool "$PKGTOOL" --catalog

      - name: Collect artifacts
        id: collect
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          cp build/IV0000-NULL00001_00-NULLSTOR00000000.pkg "dist/NULL_store-PS4-${VER}.pkg"
          cp build/IV0000-NULL00002_00-NULLSTORSERVICE0.pkg "dist/NULL_store-Background-Service-${VER}.pkg"
          (cd dist && sha256sum *.pkg | tee SHA256SUMS.txt)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NULL_store-PKGs-${{ steps.collect.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
